name: CI/CD Deploy Abhidhammatthasangaha

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (Strict TypeScript)
        run: npm run type-check

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Build Web Static Site
        run: npm run build:web

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Automated Deploy to GitHub Pages: Abhidhammatthasangaha Reader [skip ci]"
